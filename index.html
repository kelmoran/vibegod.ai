<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>vibegod.ai</title>
<meta name="description" content="vibegod.ai is coming soon.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23ff4d00'/%3E%3Crect x='4' y='4' width='56' height='56' fill='none' stroke='%23111111' stroke-width='4'/%3E%3Ctext x='32' y='47' font-family='Arial Black, sans-serif' font-size='42' text-anchor='middle' fill='%23111111'%3EV%3C/text%3E%3C/svg%3E">
<style>
  @font-face {
    font-family: "Archivo Black";
    src: url("fonts/ArchivoBlack-Regular.ttf") format("truetype");
    font-weight: 400; font-style: normal; font-display: swap;
  }
  :root { --paper: #f2efe9; --ink: #111111; --blaze: #ff4d00; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  .bar {
    background: var(--ink); color: var(--paper);
    font-family: "Liberation Mono", ui-monospace, Menlo, monospace;
    font-size: .68rem; letter-spacing: .22em; text-align: center;
    padding: 6px 8px; white-space: nowrap; overflow: hidden;
  }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 24px; }
  .wrap { text-align: left; max-width: 860px; width: 100%; }
  .kicker {
    display: inline-flex; align-items: center; gap: 10px;
    font-weight: 800; font-size: .78rem; letter-spacing: .16em; text-transform: uppercase;
    margin-bottom: 26px;
  }
  .kicker::before { content: ""; width: 14px; height: 14px; background: var(--blaze); }
  h1 {
    font-family: "Archivo Black", "Arial Black", sans-serif;
    font-size: clamp(3.4rem, 12vw, 9.5rem);
    line-height: .86; letter-spacing: -.01em;
    margin: 0 0 30px; color: var(--ink);
  }
  .soon {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 16px 30px;
    border: 2px solid var(--ink);
    background: var(--blaze); color: var(--ink);
    font-family: "Archivo Black", "Arial Black", sans-serif;
    font-size: clamp(1.1rem, 3vw, 1.7rem);
    text-transform: uppercase; letter-spacing: .04em;
    box-shadow: 6px 6px 0 var(--ink);
  }
  .soon .dot { width: 12px; height: 12px; background: var(--paper); animation: pulse 1.6s ease infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .2; } }
  footer {
    background: var(--ink); color: var(--paper);
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px; font-size: .8rem;
  }
  footer .mono { font-family: "Liberation Mono", ui-monospace, Menlo, monospace; letter-spacing: .1em; }
  @media (max-width: 560px) { footer { flex-direction: column; gap: 6px; } }
</style>
</head>
<body>
  <div class="bar">VIBE CODE EVERYTHING &nbsp;&#9632;&nbsp; NO PERMISSION NEEDED &nbsp;&#9632;&nbsp; COMING SOON</div>
  <main>
    <div class="wrap">
      <p class="kicker">The vibe coding platform</p>
      <h1>VIBEGOD</h1>
      <span class="soon"><span class="dot"></span> COMING SOON</span>
    </div>
  </main>
  <footer>
    <span>&copy; 2026 vibegod.ai</span>
    <span class="mono">BUILD IN THE OPEN</span>
  </footer>
</body>
</html>
