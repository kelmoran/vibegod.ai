<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>vibegod.ai</title>
<meta name="description" content="vibegod.ai is coming soon: a place to vibe code everything.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230a0c10'/%3E%3Ctext x='32' y='46' font-family='Arial Black, sans-serif' font-size='40' font-weight='900' text-anchor='middle' fill='%239dff3f'%3EV%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg: #0a0c10; --ink: #f2f5f9; --dim: #9aa3b2; --accent: #9dff3f; --line: rgba(255,255,255,.12); }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background:
      radial-gradient(900px 420px at 85% -10%, rgba(157,255,63,.10), transparent 60%),
      radial-gradient(700px 380px at -10% 20%, rgba(139,92,246,.12), transparent 55%),
      var(--bg);
    color: var(--ink);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column;
  }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 24px; }
  .wrap { max-width: 760px; width: 100%; text-align: center; }
  .brand {
    display: inline-flex; align-items: center; gap: 12px;
    font-weight: 900; font-size: 15px; letter-spacing: .28em; text-transform: uppercase;
    color: var(--dim); margin-bottom: 40px;
  }
  .brand .mark {
    width: 34px; height: 34px; border-radius: 9px; display: inline-flex;
    align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    color: #0b1400; font-size: 18px; font-weight: 900; letter-spacing: 0;
  }
  h1 {
    font-size: clamp(3rem, 11vw, 7.5rem); line-height: .92; letter-spacing: -.04em;
    margin: 0 0 22px; font-weight: 900;
    background: linear-gradient(100deg, var(--ink) 30%, var(--accent) 75%, #8b5cf6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { font-size: clamp(1.05rem, 2.6vw, 1.4rem); color: var(--ink); font-weight: 650; margin: 0 0 14px; }
  .copy { color: var(--dim); font-size: 1rem; line-height: 1.65; max-width: 52ch; margin: 0 auto 42px; }
  .soon {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 26px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--dim); font-size: .9rem; font-weight: 600;
  }
  .soon b { color: var(--accent); font-weight: 800; }
  .soon .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s ease infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  footer {
    border-top: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 24px; color: var(--dim); font-size: .8rem;
  }
  footer .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .08em; }
  @media (max-width: 560px) { footer { flex-direction: column; gap: 6px; } }
</style>
</head>
<body>
  <main>
    <div class="wrap">
      <div class="brand"><span class="mark">V</span> VIBEGOD.AI</div>
      <h1>VIBEGOD</h1>
      <p class="sub">A place to vibe code everything.</p>
      <p class="copy">
        Start projects, build with AI, and share what you make.
        The doors are not open yet. We are building the workshop.
      </p>
      <span class="soon"><span class="dot"></span> <b>COMING SOON</b></span>
    </div>
  </main>
  <footer>
    <span>&copy; 2026 vibegod.ai</span>
    <span class="mono">BUILD IN THE OPEN</span>
  </footer>
</body>
</html>
